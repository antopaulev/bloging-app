{% extends 'base.html' %}

{% block content %}

<!-- featured post list -->
 <h3>{{category}}</h3>
  <div class="row mb-2">
    {% for post in posts %}
    <div class="col-md-6">
      <div class="card border-0" >
        <div class="card-body">
          <h3><a href="{% url 'blogs' post.slug %}" class="text-dark">{{post.title}}</a></h3>
          <small class="mb-1 text-muted">{{post.updated_at | timesince }} ago | {{post.author}}</small>
          <p class="card-text">{{post.short_discription | truncatewords:25}}</p>
        </div>
      </div>
    </div>
   {% endfor %}   
  </div>

</div>
{% endblock %}
